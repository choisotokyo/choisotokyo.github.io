const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([35.681, 139.767], 13);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>',
}).addTo(map);

const pin = (s, on) => L.divIcon({
  className: "tear" + (s.w ? " gold" : "") + (on ? " on" : ""),
  html: "<b></b>", iconSize: [22, 30], iconAnchor: [11, 30], popupAnchor: [0, -28],
});

const stationLayer = L.layerGroup();
const stationMarks = (typeof STATIONS === "undefined" ? [] : STATIONS).map((st) =>
  L.marker([st.lat, st.lon], {
    icon: L.divIcon({ className: "sta", html: "<b></b><span>" + st.n + "</span>", iconSize: [0, 0], iconAnchor: [0, 0] }),
    interactive: false, zIndexOffset: -500,
  }));
function syncStations() {
  const z = map.getZoom();
  if (z >= 13) {
    if (!map.hasLayer(stationLayer)) map.addLayer(stationLayer);
    const b = map.getBounds();
    stationLayer.clearLayers();
    for (const m of stationMarks) if (b.contains(m.getLatLng())) stationLayer.addLayer(m);
  } else if (map.hasLayer(stationLayer)) map.removeLayer(stationLayer);
}
map.on("zoomend moveend", syncStations);
map.on("popupclose", () => { pinned = ""; });

const group = L.markerClusterGroup({
  maxClusterRadius: 44, showCoverageOnHover: false,
  iconCreateFunction: (c) => L.divIcon({
    className: "cluster", html: "<b>" + c.getChildCount() + "</b>",
    iconSize: [36, 36], iconAnchor: [18, 18],
  }),
});

let shown = [], byId = new Map();
let pinned = "";                                   // クリックで開いたもの（かざしただけのものと区別する）
const canHover = window.matchMedia("(hover: hover)").matches;   // 指で触る画面では、かざす動作が無い

const popupOf = (s) =>
  '<a class="mp" href="s/' + s.i + '.html">'
  + (s.f ? '<img src="img/' + s.f + '" alt="" width="84" height="84">' : "")
  + "<span><b>" + esc(s.n) + "</b>"
  + "<i>" + esc(s.b || s.g) + (s.t ? " · " + esc(s.t) : "") + "</i>"
  + (s.wy ? "<em>" + esc(s.wy) + "</em>" : s.h ? "<em>" + esc(s.h) + "</em>" : "")
  + (s.p ? "<u>" + esc(s.p) + "</u>" : "")
  + "</span></a>";

function build(list) {
  group.clearLayers();
  byId = new Map();
  shown = list.filter((s) => s.lat);
  const marks = shown.map((s) => {
    const mk = L.marker([s.lat, s.lon], { icon: pin(s, false), title: s.n });
    mk.bindPopup(popupOf(s), { maxWidth: 270 });
    mk.on("click", () => { pinned = s.i; select(s.i, false); });
    if (canHover) {
      // かざしただけで中身が見えるようにする。離したら閉じる（クリックで開いたものは残す）
      mk.on("mouseover", () => { if (pinned !== s.i) mk.openPopup(); highlightRow(s.i, true); });
      mk.on("mouseout", () => { if (pinned !== s.i) mk.closePopup(); highlightRow(s.i, false); });
    }
    mk.store = s;
    byId.set(s.i, mk);
    return mk;
  });
  group.addLayers(marks);
  map.addLayer(group);
  $("#mcount").textContent = shown.length + "店";
  drawList();
}

function badge(s) {
  if (mode === "理由") {
    return s.y ? s.y.split("・").map((x) => '<em class="wt">' + esc(x) + "</em>").join("") : "";
  }
  return s.w ? '<em class="wt">わざわざ行く価値がある</em>' : "";
}

function drawList() {
  $("#mlist").innerHTML = shown.slice(0, 300).map((s) => `<li class="mrow" data-i="${s.i}">
    <button type="button">
      ${s.f ? `<img src="img/${s.f}" alt="${esc(s.n)}" loading="lazy" width="88" height="88">` : '<span class="noph"></span>'}
      <span class="t">
        <b>${esc(s.n)}${s.s ? ' <i class="st">★</i>' : ""}</b>
        <i>${esc(s.b || s.g)}${s.t ? " · " + esc(s.t) : ""}${s.dist ? " · " + s.dist : ""}</i>
        ${badge(s)}
        ${(s.wy || s.h) ? `<span class="ln">${esc(s.wy || s.h)}</span>` : ""}
        ${s.p ? `<u>${esc(s.p)}</u>` : ""}
      </span>
    </button>
    <a class="go" href="s/${s.i}.html">くわしく</a>
  </li>`).join("") + (shown.length > 300 ? '<li class="more">多すぎるので300店まで出しています。絞り込むと残りも出ます</li>' : "");
  document.querySelectorAll("#mlist .mrow button").forEach((b) => {
    const id = b.parentElement.dataset.i;
    b.onclick = () => { pinned = id; select(id, true); };
    if (canHover) {
      b.onmouseenter = () => { const m = byId.get(id); if (m && pinned !== id) m.setIcon(pin(m.store, true)); };
      b.onmouseleave = () => { const m = byId.get(id); if (m && pinned !== id) m.setIcon(pin(m.store, false)); };
    }
  });
}

function highlightRow(id, on) {
  const row = document.querySelector('#mlist .mrow[data-i="' + id + '"]');
  if (row) row.classList.toggle("hi", on);
}

function select(id, fromList) {
  document.querySelectorAll("#mlist .mrow").forEach((el) => el.classList.toggle("on", el.dataset.i === id));
  const mk = byId.get(id);
  if (!mk) return;
  for (const [k, m] of byId) m.setIcon(pin(m.store, k === id));
  if (fromList) {
    // 画面が狭いときは一覧が地図の下にあるので、押したら地図が見える位置まで戻す
    if (window.matchMedia("(max-width: 800px)").matches) {
      const wrap = document.querySelector(".mapwrap");
      if (wrap) window.scrollTo({ top: wrap.offsetTop - 4, behavior: "smooth" });
    }
    group.zoomToShowLayer(mk, () => { map.setView(mk.getLatLng(), Math.max(map.getZoom(), 16)); mk.openPopup(); });
  } else {
    const row = document.querySelector('#mlist .mrow[data-i="' + id + '"]');
    if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

let mode = "理由", genre = "";
function apply() {
  build(D.filter((s) => (mode !== "理由" || s.w) && (mode !== "推し" || s.s) && (!genre || s.g === genre)));
}

let me = null, ring = null;
function locate() {
  if (!navigator.geolocation) { $("#mnote").textContent = "この端末では現在地が使えません"; return; }
  $("#mnote").textContent = "現在地を調べています…";
  navigator.geolocation.getCurrentPosition((p) => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (me) { map.removeLayer(me); map.removeLayer(ring); }
    me = L.marker(ll, { icon: L.divIcon({ className: "mepin", html: "<b></b>", iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).addTo(map);
    ring = L.circle(ll, { radius: Math.max(p.coords.accuracy || 0, 60), color: "#2f6fd0", weight: 1, fillColor: "#2f6fd0", fillOpacity: .12 }).addTo(map);
    map.setView(ll, 15);
    // 一覧を近い順に並べ替える
    for (const s of shown) {
      const d = map.distance(ll, [s.lat, s.lon]) / 1000;
      s._d = d;
      s.dist = d < 1 ? Math.round(d * 1000) + "m" : d.toFixed(1) + "km";
    }
    shown.sort((a, b) => a._d - b._d);
    drawList();
    $("#mnote").textContent = "近い順に並べ替えました";
  }, (e) => {
    $("#mnote").textContent = e.code === 1
      ? "現在地の使用が許可されていません。ブラウザの設定で許可すると、近い順に並べ替えられます。"
      : "現在地が取れませんでした";
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

document.querySelectorAll("#mchips .chip").forEach((b) => {
  b.onclick = () => {
    if (b.dataset.f !== undefined) mode = mode === b.dataset.f ? "" : b.dataset.f;
    else genre = genre === b.dataset.g ? "" : b.dataset.g;
    document.querySelectorAll("#mchips .chip").forEach((x) =>
      x.setAttribute("aria-pressed", String(x.dataset.f !== undefined ? x.dataset.f === mode : x.dataset.g === genre)));
    apply();
  };
});
$("#mlocate").onclick = locate;
$("#mfit").onclick = () => { if (shown.length) map.fitBounds(group.getBounds(), { padding: [30, 30] }); };
apply();
syncStations();

</script>
